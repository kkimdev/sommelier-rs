name: Virtwl Release

on:
  push:
    tags:
      - "virtwl-v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: virtwl-release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Native builds on the same Ubuntu release as CI, so each binary is
        # tested on its own architecture and links the same glibc baseline.
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup

      - name: Verify tag matches Cargo.toml
        shell: bash
        run: |
          cargo_version="$(cargo metadata --locked --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "sommelier") | .version')"
          tag_version="${GITHUB_REF_NAME#virtwl-v}"
          base_tag_version="${tag_version%%-*}"

          echo "Cargo version: ${cargo_version}"
          echo "Tag version: ${tag_version}"
          test "${cargo_version}" = "${base_tag_version}" || {
            echo "::error::Cargo.toml version does not match the release tag"
            exit 1
          }

      - name: Run regression tests
        run: cargo test --locked --workspace --all-targets -- --test-threads=1

      - name: Build release binary
        run: cargo build --locked --release --package sommelier --verbose

      - name: Prepare release artifact
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#virtwl-}"
          artifact="sommelier_rs_virtwl-${version}-${ARCH}"
          install -Dm755 target/release/sommelier "${artifact}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: virtwl-${{ matrix.arch }}
          path: sommelier_rs_virtwl-*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: virtwl-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum sommelier_rs_virtwl-* > SHA256SUMS

      - name: Create draft release and upload assets
        uses: softprops/action-gh-release@v2.6.1
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/*
          fail_on_unmatched_files: true
          draft: true
          prerelease: true
          generate_release_notes: true

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          release_id="$(
            gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq ".[] | select(.tag_name == \"${TAG_NAME}\") | .id"
          )"
          test -n "${release_id}" || {
            echo "::error::Draft release for ${TAG_NAME} was not found"
            exit 1
          }
          gh api --method PATCH \
            "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
            -f draft=false
