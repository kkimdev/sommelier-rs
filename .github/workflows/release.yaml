name: Virtwl Release

# A release is cut by pushing a tag; see "CI and release workflow" in the
# README.
on:
  push:
    tags:
      - "virtwl-v*"

permissions:
  contents: read

concurrency:
  group: virtwl-release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Released binaries need at most this glibc symbol version today, so they
  # run on Debian bookworm (2.36), the Crostini container base. A build that
  # needs a newer one fails here; raising this is a compatibility decision
  # that also changes the README's install prerequisites.
  MAX_GLIBC_VERSION: "2.34"

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Native builds on the same Ubuntu release as CI, so each binary is
        # tested on its own architecture and links the same glibc baseline.
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: ./.github/actions/setup

      - name: Verify tag matches Cargo.toml
        shell: bash
        run: |
          cargo_version="$(cargo metadata --locked --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "sommelier") | .version')"
          tag_version="${GITHUB_REF_NAME#virtwl-v}"
          base_tag_version="${tag_version%%-*}"

          echo "Cargo version: ${cargo_version}"
          echo "Tag version: ${tag_version}"
          test "${cargo_version}" = "${base_tag_version}" || {
            echo "::error::Cargo.toml version does not match the release tag"
            exit 1
          }
          echo "CARGO_VERSION=${cargo_version}" >> "${GITHUB_ENV}"

      - name: Run regression tests
        run: cargo test --locked --workspace --all-targets -- --test-threads=1

      - name: Build release binary
        run: cargo build --locked --release --package sommelier --verbose

      - name: Prepare release artifact
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          artifact="dist/sommelier_rs_${GITHUB_REF_NAME}-${ARCH}"
          install -Dm755 target/release/sommelier "${artifact}"
          echo "ARTIFACT=${artifact}" >> "${GITHUB_ENV}"

      - name: Smoke-test the release artifact
        shell: bash
        run: |
          # Run the exact file that will be uploaded. --version exits before
          # the proxy opens any device or socket.
          reported="$("./${ARTIFACT}" --version)"
          echo "${reported}"
          test "${reported}" = "sommelier ${CARGO_VERSION}" || {
            echo "::error::${ARTIFACT} reported '${reported}'"
            exit 1
          }

          needed_glibc="$(objdump -T "${ARTIFACT}" \
            | grep -o 'GLIBC_[0-9.]*' | sed 's/^GLIBC_//' | sort -uV | tail -n 1)"
          echo "Highest glibc symbol version: ${needed_glibc}"
          newest="$(printf '%s\n' "${needed_glibc}" "${MAX_GLIBC_VERSION}" | sort -V | tail -n 1)"
          test "${newest}" = "${MAX_GLIBC_VERSION}" || {
            echo "::error::${ARTIFACT} needs glibc ${needed_glibc}, above ${MAX_GLIBC_VERSION}"
            exit 1
          }

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: virtwl-${{ matrix.arch }}
          path: ${{ env.ARTIFACT }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: virtwl-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum sommelier_rs_virtwl-* > SHA256SUMS

      - name: Publish the prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # With assets, gh creates the release as a draft, uploads every file,
        # and only then publishes it (or deletes the draft if an upload
        # fails), so a published release never lacks an asset. A job killed
        # mid-upload cannot clean up and leaves an orphan draft; delete it
        # before rerunning.
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --verify-tag \
            --prerelease \
            --generate-notes \
            --title "${GITHUB_REF_NAME}"
