name: Virtwl Release

on:
  push:
    tags:
      - "virtwl-v*"

permissions:
  contents: read

concurrency:
  group: virtwl-release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install x86_64 dependencies
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libdrm-dev \
            libexpat1-dev \
            libgbm-dev \
            libxkbcommon-dev \
            pkg-config

      - name: Install aarch64 dependencies
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo dpkg --add-architecture arm64
          sudo sed -i 's/Types: deb/Types: deb\nArchitectures: amd64 i386/' /etc/apt/sources.list.d/ubuntu.sources
          cat <<EOF | sudo tee /etc/apt/sources.list.d/ubuntu-ports.sources
          Types: deb
          Architectures: arm64
          URIs: http://ports.ubuntu.com/ubuntu-ports/
          Suites: $(lsb_release -cs) $(lsb_release -cs)-updates $(lsb_release -cs)-security
          Components: main universe restricted multiverse
          EOF
          sudo apt-get update
          sudo apt-get install --yes \
            gcc-aarch64-linux-gnu \
            libdrm-dev:arm64 \
            libexpat1-dev:arm64 \
            libgbm-dev:arm64 \
            libxkbcommon-dev:arm64 \
            pkg-config

      - name: Verify tag matches Cargo.toml
        shell: bash
        run: |
          cargo_version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "sommelier") | .version')"
          tag_version="${GITHUB_REF_NAME#virtwl-v}"

          echo "Cargo version: ${cargo_version}"
          echo "Tag version: ${tag_version}"
          test "${cargo_version}" = "${tag_version}" || {
            echo "::error::Cargo.toml version does not match the release tag"
            exit 1
          }

      - name: Build release binary
        shell: bash
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          PKG_CONFIG_ALLOW_CROSS: ${{ matrix.target == 'aarch64-unknown-linux-gnu' && '1' || '0' }}
          PKG_CONFIG_LIBDIR: ${{ matrix.target == 'aarch64-unknown-linux-gnu' && '/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/lib/pkgconfig:/usr/share/pkgconfig' || '/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/lib/pkgconfig:/usr/share/pkgconfig' }}
        run: cargo build --release --verbose --target "${{ matrix.target }}"

      - name: Run x86_64 regression tests
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo test --workspace --all-targets -- --test-threads=1

      - name: Prepare release artifact
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          case "${TARGET}" in
            x86_64-unknown-linux-gnu) short_arch=x86_64 ;;
            aarch64-unknown-linux-gnu) short_arch=aarch64 ;;
            *) echo "::error::Unsupported target ${TARGET}"; exit 1 ;;
          esac

          version="${RELEASE_TAG#virtwl-}"
          artifact="sommelier_rs_virtwl-${version}-${short_arch}"
          install -Dm755 "target/${TARGET}/release/sommelier" "${artifact}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: virtwl-${{ matrix.target }}
          path: sommelier_rs_virtwl-*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: virtwl-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum sommelier_rs_virtwl-* > SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v2.6.1
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/*
          fail_on_unmatched_files: true
          draft: false
          prerelease: true
          generate_release_notes: true
