name: Virtwl CI

on:
  push:
    branches: ["virtwl"]
  # Stacked PRs use their immediate parent branch as the base. Run the same
  # validation for those branches instead of leaving the child PR unchecked.
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: Build and test ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Each architecture builds and runs its tests natively.
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: ./.github/actions/setup

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Build
        run: cargo build --locked --workspace --verbose

      - name: Check lints
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --locked --workspace --all-targets --verbose -- --test-threads=1

      - name: Prepare CI artifact
        if: github.event_name == 'push'
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p ci-artifact
          install -Dm755 target/debug/sommelier "ci-artifact/sommelier-${ARCH}"
          {
            printf 'commit=%s\n' "${GITHUB_SHA}"
            printf 'run_id=%s\n' "${GITHUB_RUN_ID}"
            printf 'run_attempt=%s\n' "${GITHUB_RUN_ATTEMPT}"
            printf 'arch=%s\n' "${ARCH}"
          } > ci-artifact/BUILD-INFO

      - name: Upload CI artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sommelier-debug-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
          path: ci-artifact
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
