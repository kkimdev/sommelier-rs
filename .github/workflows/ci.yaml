name: Virtwl CI

on:
  push:
    branches: ["virtwl"]
  # Stacked PRs use their immediate parent branch as the base. Run the same
  # validation for those branches instead of leaving the child PR unchecked.
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: Build and test ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Each architecture builds and runs its tests natively.
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            # Run the weston end-to-end test here; once is enough.
            e2e: true
          - arch: aarch64
            runner: ubuntu-24.04-arm
            e2e: false

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: ./.github/actions/setup

      - name: Install the end-to-end test compositor and clients
        if: matrix.e2e
        run: sudo apt-get install --yes --no-install-recommends weston wayland-utils

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check the tests the design documents cite
        run: python3 -I scripts/check-cited-tests.py

      - name: Check the documents' links and quoted rules
        run: python3 -I scripts/check-doc-links.py

      - name: Build
        run: cargo build --locked --workspace --verbose

      - name: Check lints
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Run tests
        env:
          # Fail, rather than skip, if weston or a client is missing.
          SOMMELIER_E2E_REQUIRED: ${{ matrix.e2e && '1' || '0' }}
        run: cargo test --locked --workspace --all-targets --verbose

      - name: Prepare CI artifact
        if: github.event_name == 'push'
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p ci-artifact
          install -Dm755 target/debug/sommelier "ci-artifact/sommelier-${ARCH}"
          {
            printf 'commit=%s\n' "${GITHUB_SHA}"
            printf 'run_id=%s\n' "${GITHUB_RUN_ID}"
            printf 'run_attempt=%s\n' "${GITHUB_RUN_ATTEMPT}"
            printf 'arch=%s\n' "${ARCH}"
          } > ci-artifact/BUILD-INFO

      - name: Upload CI artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sommelier-debug-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
          path: ci-artifact
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
